<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM · Agencia de Contenido</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0e12; --bg-2:#0a0b0f;
  --panel:#15161d; --panel-2:#1b1d26; --elev:#22242f;
  --border:#2a2c38; --border-soft:#21232e;
  --text:#f3f2ec; --text-2:#a4a6b2; --text-3:#6c6e7c;
  --accent:#cdfa50; --accent-ink:#11140a; --accent-dim:rgba(205,250,80,.12);
  --blue:#74a9ff; --blue-dim:rgba(116,169,255,.14);
  --violet:#b79cff; --violet-dim:rgba(183,156,255,.14);
  --amber:#ffc24b; --amber-dim:rgba(255,194,75,.14);
  --rose:#ff7a8a; --rose-dim:rgba(255,122,138,.14);
  --green:#5fd6a4; --green-dim:rgba(95,214,164,.14);
  --r:14px; --r-sm:10px;
  --shadow:0 18px 50px -20px rgba(0,0,0,.7);
  --font-d:"Bricolage Grotesque",sans-serif;
  --font-b:"Hanken Grotesk",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-b); color:var(--text);
  background:var(--bg);
  background-image:
    radial-gradient(900px 500px at 12% -5%, rgba(205,250,80,.07), transparent 60%),
    radial-gradient(800px 600px at 100% 0%, rgba(183,156,255,.06), transparent 55%);
  -webkit-font-smoothing:antialiased;
  font-size:14.5px; line-height:1.5;
}
::selection{background:var(--accent);color:var(--accent-ink)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:inherit}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}

/* SIDEBAR */
.sidebar{
  background:linear-gradient(180deg,var(--bg-2),#0c0d12);
  border-right:1px solid var(--border-soft);
  padding:22px 16px; display:flex;flex-direction:column;gap:6px;
  position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 20px}
.brand .mark{
  width:38px;height:38px;border-radius:11px;flex:none;
  background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font-family:var(--font-d);font-weight:800;font-size:20px;
  box-shadow:0 8px 22px -8px rgba(205,250,80,.6);
}
.brand .b-name{font-family:var(--font-d);font-weight:700;font-size:16px;line-height:1.1;letter-spacing:-.01em}
.brand .b-sub{font-size:11px;color:var(--text-3);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.nav-label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);padding:14px 10px 6px;font-weight:600}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--r-sm);
  color:var(--text-2);font-weight:500;font-size:14px;transition:.15s;position:relative;width:100%;text-align:left;
}
.nav-item svg{width:18px;height:18px;flex:none;stroke-width:1.9}
.nav-item:hover{background:var(--panel);color:var(--text)}
.nav-item.active{background:var(--accent-dim);color:var(--accent)}
.nav-item.active::before{content:"";position:absolute;left:-16px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav-item .badge{margin-left:auto;background:var(--panel-2);color:var(--text-2);font-size:11px;font-weight:600;padding:1px 7px;border-radius:20px;min-width:20px;text-align:center}
.nav-item.active .badge{background:var(--accent);color:var(--accent-ink)}
.side-foot{margin-top:auto;padding-top:14px}

/* MAIN */
.main{display:flex;flex-direction:column;min-width:0}
.topbar{
  display:flex;align-items:center;gap:16px;padding:20px 30px;
  border-bottom:1px solid var(--border-soft);position:sticky;top:0;z-index:20;
  background:rgba(13,14,18,.82);backdrop-filter:blur(14px);
}
.topbar h1{font-family:var(--font-d);font-weight:700;font-size:23px;letter-spacing:-.02em}
.topbar .sub{color:var(--text-3);font-size:13px;margin-top:1px}
.topbar .spacer{flex:1}
.content{padding:28px 30px 60px;max-width:1280px;width:100%}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:var(--r-sm);font-weight:600;font-size:13.5px;transition:.15s;border:1px solid transparent;white-space:nowrap}
.btn svg{width:16px;height:16px;stroke-width:2.1}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-ghost{background:var(--panel);border-color:var(--border);color:var(--text-2)}
.btn-ghost:hover{background:var(--panel-2);color:var(--text)}
.btn-danger{background:var(--rose-dim);color:var(--rose)}
.btn-danger:hover{background:var(--rose);color:#2a0d11}
.btn-sm{padding:6px 11px;font-size:12.5px}
.icon-btn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--text-3);transition:.15s}
.icon-btn:hover{background:var(--panel-2);color:var(--text)}
.icon-btn svg{width:16px;height:16px;stroke-width:2}

/* CARDS / GRID */
.grid{display:grid;gap:16px}
.cols-4{grid-template-columns:repeat(4,1fr)}
.cols-3{grid-template-columns:repeat(3,1fr)}
.cols-2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--r);padding:18px}
.stat{background:linear-gradient(155deg,var(--panel),#101118);border:1px solid var(--border-soft);border-radius:var(--r);padding:18px 18px 16px;position:relative;overflow:hidden;transition:.18s}
.stat:hover{border-color:var(--border);transform:translateY(-2px)}
.stat .s-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;margin-bottom:14px}
.stat .s-ico svg{width:18px;height:18px;stroke-width:2}
.stat .s-val{font-family:var(--font-d);font-weight:700;font-size:30px;letter-spacing:-.02em;line-height:1}
.stat .s-lbl{color:var(--text-2);font-size:12.5px;margin-top:7px;font-weight:500}
.stat .s-meta{font-size:11.5px;color:var(--text-3);margin-top:3px}

.section-head{display:flex;align-items:center;gap:12px;margin:30px 0 14px}
.section-head h2{font-family:var(--font-d);font-weight:700;font-size:17px;letter-spacing:-.01em}
.section-head .spacer{flex:1}

.list-card{background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--r);overflow:hidden}
.list-card .lc-head{padding:15px 18px;border-bottom:1px solid var(--border-soft);font-family:var(--font-d);font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:9px}
.li{display:flex;align-items:center;gap:13px;padding:12px 18px;border-bottom:1px solid var(--border-soft);transition:.12s}
.li:last-child{border-bottom:none}
.li:hover{background:var(--panel-2)}
.li .avatar{width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center;font-weight:700;font-size:13px;font-family:var(--font-d)}
.li .li-main{min-width:0;flex:1}
.li .li-t{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .li-s{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .li-r{text-align:right;flex:none}

/* BADGES */
.badge-pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;flex:none}
.b-blue{background:var(--blue-dim);color:var(--blue)} .b-blue .dot{background:var(--blue)}
.b-violet{background:var(--violet-dim);color:var(--violet)} .b-violet .dot{background:var(--violet)}
.b-amber{background:var(--amber-dim);color:var(--amber)} .b-amber .dot{background:var(--amber)}
.b-rose{background:var(--rose-dim);color:var(--rose)} .b-rose .dot{background:var(--rose)}
.b-green{background:var(--green-dim);color:var(--green)} .b-green .dot{background:var(--green)}
.b-accent{background:var(--accent-dim);color:var(--accent)} .b-accent .dot{background:var(--accent)}
.b-gray{background:var(--panel-2);color:var(--text-3)} .b-gray .dot{background:var(--text-3)}

/* TABLE */
.table-wrap{background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--r);overflow:hidden}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);font-weight:600;padding:13px 16px;border-bottom:1px solid var(--border)}
td{padding:13px 16px;border-bottom:1px solid var(--border-soft);font-size:13.5px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{transition:.12s}
tbody tr:hover{background:var(--panel-2)}
.t-name{display:flex;align-items:center;gap:11px}
.t-actions{display:flex;gap:4px;justify-content:flex-end}
.col-sticky{position:sticky;right:0;background:var(--panel);box-shadow:-6px 0 8px -6px rgba(0,0,0,.5)}
tbody tr:hover .col-sticky{background:var(--panel-2)}

/* TOOLBAR */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 13px;flex:1;min-width:200px;max-width:360px}
.search svg{width:16px;height:16px;stroke-width:2;color:var(--text-3);flex:none}
.search input{background:none;border:none;outline:none;color:var(--text);width:100%}
.search input::placeholder{color:var(--text-3)}
.seg{display:flex;background:var(--panel);border:1px solid var(--border);border-radius:var(--r-sm);padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--text-2)}
.seg button.active{background:var(--accent-dim);color:var(--accent)}
.select-mini{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 12px;color:var(--text);font-weight:500;outline:none}

/* KANBAN */
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
.kcol{background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--r);min-height:200px;display:flex;flex-direction:column;transition:.15s}
.kcol.drop{border-color:var(--accent);background:var(--accent-dim)}
.kcol-head{display:flex;align-items:center;gap:9px;padding:14px 16px;border-bottom:1px solid var(--border-soft)}
.kcol-head .kc-dot{width:8px;height:8px;border-radius:50%}
.kcol-head .kc-t{font-family:var(--font-d);font-weight:600;font-size:14px}
.kcol-head .kc-n{margin-left:auto;font-size:12px;color:var(--text-3);font-weight:600;background:var(--panel-2);padding:1px 8px;border-radius:20px}
.kcol-head .kc-sum{font-size:11px;color:var(--text-3);width:100%;margin-top:2px}
.kcol-body{padding:10px;display:flex;flex-direction:column;gap:9px;min-height:80px}
.kcard{background:var(--panel-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px;cursor:grab;transition:.14s}
.kcard:hover{border-color:var(--text-3);transform:translateY(-1px)}
.kcard.dragging{opacity:.4}
.kcard .kc-name{font-weight:600;font-size:13.5px}
.kcard .kc-biz{font-size:12px;color:var(--text-3);margin-top:1px}
.kcard .kc-foot{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.kcard .kc-val{font-family:var(--font-d);font-weight:700;font-size:13.5px;color:var(--accent)}
.kempty{text-align:center;color:var(--text-3);font-size:12.5px;padding:18px 8px;border:1px dashed var(--border);border-radius:var(--r-sm)}

/* CALENDAR */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.cal-dow{text-align:center;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);font-weight:600;padding-bottom:4px}
.cal-cell{background:var(--panel);border:1px solid var(--border-soft);border-radius:10px;min-height:96px;padding:8px;display:flex;flex-direction:column;gap:4px}
.cal-cell.muted{opacity:.4}
.cal-cell.today{border-color:var(--accent)}
.cal-cell .cd{font-size:12px;font-weight:600;color:var(--text-2)}
.cal-cell.today .cd{color:var(--accent)}
.cal-chip{font-size:10.5px;font-weight:600;padding:3px 6px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;display:flex;align-items:center;gap:5px}
.cal-chip .dot{width:5px;height:5px}

/* PLANS */
.plan-card{background:linear-gradient(165deg,var(--panel),#101118);border:1px solid var(--border-soft);border-radius:18px;padding:24px;display:flex;flex-direction:column;position:relative;transition:.18s;min-height:340px}
.plan-card:hover{transform:translateY(-3px);border-color:var(--border)}
.plan-card.featured{border-color:var(--accent);box-shadow:0 20px 60px -28px rgba(205,250,80,.4)}
.plan-card .feat-tag{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;padding:3px 12px;border-radius:20px;letter-spacing:.04em}
.plan-card .p-name{font-family:var(--font-d);font-weight:700;font-size:20px;letter-spacing:-.01em}
.plan-card .p-price{font-family:var(--font-d);font-weight:800;font-size:34px;letter-spacing:-.02em;margin:14px 0 2px;display:flex;align-items:baseline;gap:6px}
.plan-card .p-price .per{font-size:13px;font-weight:500;color:var(--text-3);font-family:var(--font-b)}
.plan-card .p-desc{color:var(--text-2);font-size:13px;margin:6px 0 16px;min-height:38px}
.plan-card ul{list-style:none;display:flex;flex-direction:column;gap:9px;flex:1}
.plan-card li{display:flex;gap:9px;font-size:13px;color:var(--text-2);align-items:flex-start}
.plan-card li svg{width:15px;height:15px;color:var(--accent);flex:none;margin-top:2px;stroke-width:2.4}
.plan-card .p-actions{display:flex;gap:8px;margin-top:18px}
.plan-empty{color:var(--text-3);font-style:italic}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(6,7,10,.7);backdrop-filter:blur(6px);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:40px 16px;overflow-y:auto}
.modal-bg.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:18px;width:100%;max-width:560px;box-shadow:var(--shadow);animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;padding:20px 22px;border-bottom:1px solid var(--border-soft)}
.modal-head h3{font-family:var(--font-d);font-weight:700;font-size:18px;letter-spacing:-.01em}
.modal-body{padding:22px;display:flex;flex-direction:column;gap:15px;max-height:62vh;overflow-y:auto}
.modal-foot{padding:16px 22px;border-top:1px solid var(--border-soft);display:flex;gap:10px;justify-content:flex-end}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.field input,.field select,.field textarea{
  width:100%;background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:10px 12px;color:var(--text);outline:none;transition:.14s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:70px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.check-row{display:flex;align-items:center;gap:9px}
.check-row input{width:auto}

/* EMPTY */
.empty-state{text-align:center;padding:60px 20px;color:var(--text-3)}
.empty-state svg{width:42px;height:42px;stroke-width:1.5;color:var(--text-3);margin-bottom:14px}
.empty-state h3{font-family:var(--font-d);color:var(--text-2);font-weight:600;font-size:16px;margin-bottom:5px}
.empty-state p{font-size:13px;max-width:340px;margin:0 auto 18px}

/* TOAST */
.toast-wrap{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:10px;z-index:200}
.toast{background:var(--elev);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:10px;padding:12px 16px;font-size:13px;font-weight:500;box-shadow:var(--shadow);animation:slidein .25s ease;min-width:220px}
@keyframes slidein{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}

.muted{color:var(--text-3)}
.bars{display:flex;flex-direction:column;gap:11px;margin-top:4px}
.bar-row{display:flex;align-items:center;gap:11px;font-size:13px}
.bar-row .bl{width:78px;flex:none;font-weight:500}
.bar-track{flex:1;height:7px;background:var(--panel-2);border-radius:6px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px}
.bar-row .bn{width:26px;text-align:right;font-weight:600;color:var(--text-2)}

@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;z-index:50;transform:translateX(-100%);transition:.25s;width:248px}
  .sidebar.open{transform:none}
  .cols-4{grid-template-columns:1fr 1fr}
  .cols-3,.cols-2{grid-template-columns:1fr}
  .kanban{grid-template-columns:1fr}
  .menu-btn{display:grid!important}
  .content{padding:20px 16px 60px}
  .topbar{padding:16px}
}
.menu-btn{display:none}
</style>
</head>
<body>

<style>
.login-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);background-image:radial-gradient(900px 500px at 50% -10%, rgba(205,250,80,.08), transparent 60%);z-index:999;padding:20px}
.login-card{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:34px 28px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.login-logo{width:46px;height:46px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-family:var(--font-d);font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.login-card h2{font-family:var(--font-d);font-weight:700;font-size:22px}
.login-sub{color:var(--text-2);font-size:13.5px;margin-bottom:6px}
.login-card input{background:var(--bg-2);border:1px solid var(--border);color:var(--text);border-radius:var(--r-sm);padding:12px 14px;outline:none;font-size:14.5px}
.login-card input:focus{border-color:var(--accent)}
.login-err{color:var(--rose);font-size:13px;min-height:16px}
.login-btn{background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:var(--r-sm);padding:12px;font-size:15px;font-family:var(--font-d)}
.login-btn:disabled{opacity:.6;cursor:default}
</style>

<!-- LOGIN -->
<div id="loginScreen" class="login-screen" style="display:none">
  <div class="login-card">
    <div class="login-logo">C</div>
    <h2>Acceso al equipo</h2>
    <p class="login-sub">Ingresá con el usuario compartido del equipo.</p>
    <input id="login_email" type="email" placeholder="Email del equipo" autocomplete="username">
    <input id="login_pass" type="password" placeholder="Contraseña" autocomplete="current-password">
    <div id="loginErr" class="login-err"></div>
    <button id="loginBtn" class="login-btn" onclick="doLogin()">Entrar</button>
  </div>
</div>

<div class="app" id="app" style="display:none">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="mark" id="brandMark">A</div>
      <div>
        <div class="b-name" id="brandName">Tu Agencia</div>
        <div class="b-sub">CRM · Contenido</div>
      </div>
    </div>
    <nav id="nav"></nav>

function togglePwSpan(spanId){

async function applyOnboardingSubmission(subId){
  const s = onboardingSubs.find(x=>x.id===subId); if(!s) return;
  const c = contactById(s.contact_id);
  if(!c){ toast('No se encontró el cliente asociado'); return; }
  c.onboarding = s.payload;
  c.onboardingEstado = 'completado';
  c.onboardingCompletadoEn = todayISO();
  save();
  try{
    const { error } = await sb.from('onboarding_submissions').update({ procesado:true }).eq('id', s.id);
    if(error) throw error;
  }catch(e){ console.error('Error al marcar procesado:', e); }
  toast('Ficha aplicada a '+c.nombre);
  RENDER.onboarding();
}
function discardSubmission(subId){
  confirmModal('¿Descartar esta respuesta?','No se va a aplicar a ningún cliente. Esta acción no se puede deshacer.',async()=>{
    try{
      const { error } = await sb.from('onboarding_submissions').update({ procesado:true }).eq('id', subId);
      if(error) throw error;
    }catch(e){ console.error('Error al descartar:', e); }
    toast('Respuesta descartada');
    RENDER.onboarding();
  });
}

RENDER.pipeline=function(){
  topAction(`<button class="btn btn-primary" onclick="contactModal()">${svg(I.plus)} Nuevo lead</button>`);
  const cols = STAGES.map(s=>{
    const items=state.contacts.filter(c=>c.etapa===s.id);
    const sum=items.reduce((a,c)=>a+monthlyValue(c),0);
    return `<div class="kcol" data-stage="${s.id}" ondragover="kOver(event)" ondragleave="kLeave(event)" ondrop="kDrop(event,'${s.id}')">
      <div class="kcol-head"><span class="kc-dot" style="background:${s.color}"></span><span class="kc-t">${s.label}</span><span class="kc-n">${items.length}</span>
        <div class="kc-sum">${fmtMoney(sum,state.settings.currency)} / mes</div></div>
      <div class="kcol-body">
        ${items.length?items.map(c=>kcard(c)).join(''):'<div class="kempty">Arrastrá tarjetas aquí</div>'}
      </div></div>`;
  }).join('');
  C().innerHTML=`<div class="kanban">${cols}</div>`;
};
function kcard(c){
  return `<div class="kcard" draggable="true" data-id="${c.id}" ondragstart="kStart(event,'${c.id}')" ondragend="kEnd(event)" onclick="contactModal('${c.id}')">
    <div class="kc-name">${escapeHtml(c.nombre)}</div>
    <div class="kc-biz">${escapeHtml(c.empresa||c.instagram||'—')}</div>
    <div class="kc-foot">
      <span class="kc-val">${monthlyValue(c)?fmtMoney(monthlyValue(c),contactCurrency(c)):''}</span>
      ${c.origen?`<span class="badge-pill b-gray"><span class="dot"></span>${escapeHtml(c.origen)}</span>`:''}
    </div></div>`;

/* ---- Conexiones de API por plataforma (YouTube e Instagram reales; TikTok requiere app propia) ---- */
// Sigue la paginación de la Graph API (paging.next) para traer todo el historial,
// no solo la primera página, con un tope de seguridad para no pedir infinito.
// opts.cutoff (yyyy-mm-dd) + opts.dateOf(item)=>yyyy-mm-dd: si se pasan, corta la
// paginación apenas encuentra un item más viejo que el corte (los resultados vienen
// del más nuevo al más viejo), para no seguir pidiendo páginas de contenido que
// después se va a descartar igual.
async function fetchAllPages(url, opts={}){
  const { maxPages=6, cutoff=null, dateOf=null } = opts;
  let results = [];
  let next = url;
  let pages = 0;
  let stop = false;
  while(next && pages < maxPages && !stop){
    const res = await fetch(next);
    const data = await res.json();
    if(data.error) throw new Error(data.error.message);
    const items = data.data||[];
    results = results.concat(items);
    if(cutoff && dateOf && items.some(it=>{ const d=dateOf(it); return d && d<cutoff; })) stop=true;
    next = data.paging && data.paging.next;
    pages++;
  }
  return results;
}
function upsertApiVideo(clientId,plataforma,link,data){
  let existing = state.videos.find(x=>x.clientId===clientId && x.plataforma===plataforma && x.link===link);
  const obj = Object.assign({
    id: existing?existing.id:uid(), clientId, plataforma, link,
    compartidos: existing?existing.compartidos:'', guardados: existing?existing.guardados:'',
    retencionSeg: existing?existing.retencionSeg:'', publicadoEn: existing?existing.publicadoEn:'',
    notas: existing?existing.notas:''
  }, data);
  if(existing){ const i=state.videos.findIndex(x=>x.id===existing.id); state.videos[i]=obj; }
  else state.videos.unshift(obj);
}

    return `<div class="li" style="padding:10px 0">
      <div class="li-main"><div class="li-t">${r.pl}</div><div class="li-s">${conectado?('Conectado'+(conf.ultimaSync?(' · última sync '+fmtDateLong(conf.ultimaSync.slice(0,10))):'')+(conf.desde?(' · desde '+fmtDateLong(conf.desde)):'')):'No conectado'}</div></div>
      <div class="li-r" style="display:flex;gap:6px">
        ${conectado&&r.sync?`<button class="btn btn-ghost btn-sm" onclick="${r.sync}('${c.id}')">Sincronizar</button>`:''}

async function syncYoutube(clientId){
  const c=contactById(clientId);
  const conf=c.conexiones&&c.conexiones.youtube;
  const key=state.settings.youtubeApiKey;
  if(!conf||!conf.channelId||!key){ toast('Falta configurar YouTube para este cliente'); return; }
  toast('Sincronizando YouTube…');
  try{
    const chRes=await fetch(`https://www.googleapis.com/youtube/v3/channels?part=contentDetails&id=${encodeURIComponent(conf.channelId)}&key=${encodeURIComponent(key)}`);
    const chData=await chRes.json();
    if(chData.error) throw new Error(chData.error.message);
    const channel=chData.items&&chData.items[0];
    if(!channel) throw new Error('No se encontró el canal. Revisá el Channel ID.');
    const uploadsId=channel.contentDetails.relatedPlaylists.uploads;
    // Recorre todas las páginas de la playlist de subidos (no solo las primeras 15).
    // Si hay fecha de corte, corta apenas ve un video más viejo (vienen del más nuevo
    // al más viejo) para no seguir pidiendo páginas de contenido que se va a descartar.
    let videoIds=[]; let pageToken=''; let pages=0; let stop=false;
    do{
      const plRes=await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?part=contentDetails&maxResults=50&playlistId=${encodeURIComponent(uploadsId)}&key=${encodeURIComponent(key)}${pageToken?'&pageToken='+pageToken:''}`);
      const plData=await plRes.json();
      if(plData.error) throw new Error(plData.error.message);
      (plData.items||[]).forEach(i=>{
        const pub=(i.contentDetails.videoPublishedAt||'').slice(0,10);
        if(conf.desde && pub && pub<conf.desde){ stop=true; return; }
        videoIds.push(i.contentDetails.videoId);
      });
      pageToken = plData.nextPageToken||'';
      pages++;
    }while(pageToken && pages<6 && !stop);
    if(!videoIds.length){ toast('No hay videos públicos en ese rango de fechas'); return; }
    // La API de videos.list acepta hasta 50 IDs por llamada, así que se piden en tandas.
    let total=0;
    for(let i=0;i<videoIds.length;i+=50){
      const tanda=videoIds.slice(i,i+50);
      const vRes=await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&id=${tanda.join(',')}&key=${encodeURIComponent(key)}`);
      const vData=await vRes.json();
      if(vData.error) throw new Error(vData.error.message);
      (vData.items||[]).forEach(item=>{
        upsertApiVideo(clientId,'YouTube','https://www.youtube.com/watch?v='+item.id,{
          titulo:item.snippet.title, fecha:(item.snippet.publishedAt||'').slice(0,10), publicadoEn:item.snippet.publishedAt||'',
          vistas:item.statistics.viewCount||0, likes:item.statistics.likeCount||0,
          comentarios:item.statistics.commentCount||0, origen:'api'
        });
        total++;
      });
    }
    conf.estado='conectado'; conf.ultimaSync=new Date().toISOString();
    save(); RENDER.metricas();
    toast('YouTube sincronizado: '+total+' videos');
  }catch(e){ console.error('Error al sincronizar YouTube:',e); toast('Error al sincronizar YouTube: '+e.message); }
}

const IG_INSIGHT_METRICS = {
  REELS: ['views','plays','reach','saved','shares','ig_reels_avg_watch_time'],
  VIDEO: ['views','video_views','reach','saved','shares'],
  CAROUSEL_ALBUM: ['reach','saved','shares'],
  IMAGE: ['reach','saved','shares']
};
// Meta va renombrando/deprecando métricas de Insights seguido (ej: "plays" -> "views",
// "impressions" ya no existe para cuentas nuevas). Si se pide todo en una sola llamada
// con metric=a,b,c y UNA sola métrica no es válida, la Graph API rechaza el pedido
// entero y perdemos todo. Por eso acá se pide cada métrica por separado: la que falle
// simplemente no aparece, pero las demás sí se traen.
async function fetchIgInsights(mediaId, mediaProductType, token){
  const metrics = IG_INSIGHT_METRICS[mediaProductType] || IG_INSIGHT_METRICS.IMAGE;
  const out = {};
  for(const metric of metrics){
    try{
      const res = await fetch(`https://graph.facebook.com/v21.0/${mediaId}/insights?metric=${metric}&access_token=${encodeURIComponent(token)}`);
      const data = await res.json();
      if(!data.error && data.data && data.data[0] && data.data[0].values && data.data[0].values[0]){
        out[data.data[0].name] = data.data[0].values[0].value;
      }
    }catch(e){}
  }
  return Object.keys(out).length ? out : null;
}
async function syncInstagram(clientId){
  const c=contactById(clientId);
  const conf=c.conexiones&&c.conexiones.instagram;
  if(!conf||!conf.token||!conf.igId){ toast('Falta configurar Instagram para este cliente'); return; }
  toast('Sincronizando Instagram…');
  try{
    const url=`https://graph.facebook.com/v21.0/${encodeURIComponent(conf.igId)}/media?fields=id,caption,media_type,media_product_type,permalink,timestamp,like_count,comments_count&limit=50&access_token=${encodeURIComponent(conf.token)}`;
    const allItems = await fetchAllPages(url, { cutoff: conf.desde||null, dateOf: it=>(it.timestamp||'').slice(0,10) });
    const enRango = conf.desde ? allItems.filter(it=>(it.timestamp||'').slice(0,10)>=conf.desde) : allItems;
    // Las fotos y los carruseles no tienen "vistas" en Instagram (eso solo existe
    // para video: Reels y videos de feed) — se sincroniza solo contenido de video
    // para que todo lo que aparezca en la tabla tenga vistas disponibles.
    const soloVideo = enRango.filter(item=>item.media_type==='VIDEO');
    const omitidos = enRango.length - soloVideo.length;
    let sinInsights=0;
    for(const item of soloVideo){
      const ins = await fetchIgInsights(item.id, item.media_product_type, conf.token);
      if(!ins) sinInsights++;
      upsertApiVideo(clientId,'Instagram',item.permalink||'',{
        titulo:(item.caption||'Publicación de Instagram').slice(0,80),
        fecha:(item.timestamp||'').slice(0,10), publicadoEn:item.timestamp||'',
        likes:item.like_count||0, comentarios:item.comments_count||0,
        vistas:ins?(ins.views??ins.plays??ins.video_views??''):'',
        compartidos:ins?(ins.shares??''):'',
        guardados:ins?(ins.saved??''):'',
        retencionSeg:ins?(ins.ig_reels_avg_watch_time??''):'',
        origen:'api'
      });
    }
    conf.estado='conectado'; conf.ultimaSync=new Date().toISOString();
    save(); RENDER.metricas();
    toast('Instagram sincronizado: '+soloVideo.length+' videos'
      +(omitidos?` (se omitieron ${omitidos} fotos/carruseles, que no tienen vistas)`:'')
      +(sinInsights?` — ${sinInsights} sin métricas detalladas, revisá el permiso instagram_manage_insights`:''));
  }catch(e){ console.error('Error al sincronizar Instagram:',e); toast('Error al sincronizar Instagram: '+e.message); }
}

/* ---- CALENDARIO ---- */
RENDER.calendario=function(){
  topAction(`<button class="btn btn-primary" onclick="postModal()">${svg(I.plus)} Nueva publicación</button>`);
  const y=calCursor.getFullYear(), m=calCursor.getMonth();
  const first=new Date(y,m,1); let startDow=(first.getDay()+6)%7; // lunes=0
  const days=new Date(y,m+1,0).getDate();
  const monthName=calCursor.toLocaleDateString('es-AR',{month:'long',year:'numeric'});
  const dows=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];

  // events map yyyy-mm-dd -> [{type,title,id,color,cls}]
  const ev={};
  const push=(date,o)=>{ if(!date)return; (ev[date]=ev[date]||[]).push(o); };
  state.posts.forEach(p=>push(p.fecha,{t:'post',title:p.titulo||p.plataforma,id:p.id,color:'var(--blue)',cls:'b-blue'}));
  state.tasks.forEach(t=>push(t.fecha,{t:'task',title:(TASK_TYPES[t.tipo]||'')+': '+(t.titulo||''),id:t.id,color:'var(--violet)',cls:'b-violet'}));
  state.payments.forEach(p=>{if(p.estado!=='pagado')push(p.fecha,{t:'pay',title:'$ '+(p.concepto||'Cobro'),id:p.id,color:'var(--amber)',cls:'b-amber'});});

  let cells='';
  for(let i=0;i<startDow;i++) cells+='<div class="cal-cell muted"></div>';
  for(let d=1;d<=days;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=ds===todayISO();
    const list=(ev[ds]||[]).slice(0,4).map(o=>`<div class="cal-chip ${o.cls}" onclick="calOpen('${o.t}','${o.id}')"><span class="dot" style="background:${o.color}"></span>${escapeHtml(o.title)}</div>`).join('');
    const more=(ev[ds]||[]).length>4?`<div class="muted" style="font-size:10px">+${ev[ds].length-4} más</div>`:'';
    cells+=`<div class="cal-cell ${isToday?'today':''}"><div class="cd">${d}</div>${list}${more}</div>`;
  }

  C().innerHTML=`
    <div class="toolbar">
      <button class="btn btn-ghost btn-sm" onclick="calMove(-1)">‹ Anterior</button>
      <div style="font-family:var(--font-d);font-weight:700;font-size:17px;text-transform:capitalize;min-width:180px;text-align:center">${monthName}</div>
      <button class="btn btn-ghost btn-sm" onclick="calMove(1)">Siguiente ›</button>
      <button class="btn btn-ghost btn-sm" onclick="calToday()">Hoy</button>
      <div class="spacer" style="flex:1"></div>
      <span class="badge-pill b-blue"><span class="dot"></span>Publicaciones</span>
      <span class="badge-pill b-violet"><span class="dot"></span>Producción</span>
      <span class="badge-pill b-amber"><span class="dot"></span>Cobros</span>
    </div>
    <div class="cal-grid">${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div>`;
};
function calMove(n){calCursor=new Date(calCursor.getFullYear(),calCursor.getMonth()+n,1);RENDER.calendario();}
function calToday(){calCursor=new Date();RENDER.calendario();}
function calOpen(type,id){ if(type==='post')postModal(id); else if(type==='task')taskModal(id); else if(type==='pay')payModal(id); }

function cobrosHTML(){
  state.payments.forEach(p=>{ if(p.estado==='pendiente'&&p.fecha&&p.fecha<todayISO()) p.estado='vencido'; });
  let list=state.payments.slice().sort((a,b)=>(a.fecha||'zz')>(b.fecha||'zz')?1:-1);
  if(payFilter!=='all') list=list.filter(p=>p.estado===payFilter);
  const cur=state.settings.currency;
  const totPend=state.payments.filter(p=>p.estado==='pendiente').reduce((a,p)=>a+Number(p.monto||0),0);
  const totVenc=state.payments.filter(p=>p.estado==='vencido').reduce((a,p)=>a+Number(p.monto||0),0);
  const totPag=state.payments.filter(p=>p.estado==='pagado').reduce((a,p)=>a+Number(p.monto||0),0);

  const filtSeg=`<div class="seg">
    <button class="${payFilter==='all'?'active':''}" onclick="payFilter='all';RENDER.pagos()">Todos</button>
    ${Object.entries(PAY_STATES).map(([k,v])=>`<button class="${payFilter===k?'active':''}" onclick="payFilter='${k}';RENDER.pagos()">${v.l}</button>`).join('')}
  </div>`;
  const rows=list.length?list.map(p=>{
    return `<tr>
      <td><div style="font-weight:600">${escapeHtml(p.concepto||'Cobro')}</div><div class="muted" style="font-size:12px">${escapeHtml(p.metodo||'')}</div></td>
      <td>${escapeHtml(clientName(p.clientId))}</td>
      <td style="font-family:var(--font-d);font-weight:700">${fmtMoney(p.monto,p.moneda||cur)}</td>
      <td>${fmtDate(p.fecha)}</td>
      <td><select class="select-mini" onchange="setPayState('${p.id}',this.value)">${Object.entries(PAY_STATES).map(([k,v])=>`<option value="${k}" ${p.estado===k?'selected':''}>${v.l}</option>`).join('')}</select></td>
      <td><div class="t-actions"><button class="icon-btn" onclick="payModal('${p.id}')">${svg(I.edit)}</button><button class="icon-btn" onclick="delItem('payments','${p.id}','pagos')">${svg(I.trash)}</button></div></td>
    </tr>`;
  }).join(''):`<tr><td colspan="6">${emptyMini('Sin cobros registrados.')}</td></tr>`;

  return `
    <div class="grid cols-3" style="margin-bottom:18px">
      <div class="stat"><div class="s-ico b-amber">${svg(I.clock)}</div><div class="s-val">${fmtMoney(totPend,cur)}</div><div class="s-lbl">Pendiente de cobro</div></div>
      <div class="stat"><div class="s-ico b-rose">${svg(I.clock)}</div><div class="s-val">${fmtMoney(totVenc,cur)}</div><div class="s-lbl">Vencido</div></div>
      <div class="stat"><div class="s-ico b-green">${svg(I.check)}</div><div class="s-val">${fmtMoney(totPag,cur)}</div><div class="s-lbl">Cobrado</div></div>
    </div>
    <div class="toolbar">${filtSeg}</div>
    <div class="table-wrap"><table><thead><tr><th>Concepto</th><th>Cliente</th><th>Monto</th><th>Vencimiento</th><th>Estado</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function setPayState(id,v){const p=state.payments.find(x=>x.id===id);p.estado=v;if(v==='pagado'&&!p.fechaPago)p.fechaPago=todayISO();save();renderNav();RENDER.pagos();}
function payModal(id){
  const p=id?state.payments.find(x=>x.id===id):{estado:'pendiente',moneda:state.settings.currency,fecha:todayISO()};
  const cliOpts=`<option value="">Sin cliente</option>`+state.contacts.map(c=>`<option value="${c.id}" ${p.clientId===c.id?'selected':''}>${escapeHtml(c.nombre)}</option>`).join('');
  openModal(id?'Editar cobro':'Nuevo cobro',`
    <div class="field"><label>Concepto *</label><input id="f_con" value="${escapeHtml(p.concepto||'')}" placeholder="Ej: Plan mensual Octubre"></div>
    <div class="field-row">
      <div class="field"><label>Cliente</label><select id="f_cli">${cliOpts}</select></div>
      <div class="field"><label>Monto</label><input id="f_monto" type="number" value="${p.monto??''}" placeholder="0"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Moneda</label><select id="f_mon"><option ${(p.moneda||'ARS')==='ARS'?'selected':''}>ARS</option><option ${p.moneda==='USD'?'selected':''}>USD</option></select></div>
      <div class="field"><label>Vencimiento</label><input id="f_fecha" type="date" value="${p.fecha||''}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Estado</label><select id="f_est">${Object.entries(PAY_STATES).map(([k,v])=>`<option value="${k}" ${p.estado===k?'selected':''}>${v.l}</option>`).join('')}</select></div>
      <div class="field"><label>Método</label><input id="f_met" value="${escapeHtml(p.metodo||'')}" placeholder="Transferencia, MP, efectivo..."></div>
    </div>
  `,()=>{
    const concepto=val('f_con'); if(!concepto){toast('Poné un concepto');return false;}
    const obj={id:id||uid(),concepto,clientId:val('f_cli'),monto:val('f_monto'),moneda:val('f_mon'),fecha:val('f_fecha'),estado:val('f_est'),metodo:val('f_met'),fechaPago:p.fechaPago||''};
    if(obj.estado==='pagado'&&!obj.fechaPago)obj.fechaPago=todayISO();
    if(id){const i=state.payments.findIndex(x=>x.id===id);state.payments[i]=obj;}else state.payments.unshift(obj);
    save();renderNav();RENDER.pagos();toast(id?'Cobro actualizado':'Cobro creado');
  });
}

/* ---- GASTOS del equipo (sueldos, editores, suscripciones, herramientas...) ---- */
function gastosHTML(){
  let list=state.expenses.slice().sort((a,b)=>(a.fecha||'zz')>(b.fecha||'zz')?1:-1);
  if(gastoFilter!=='all') list=list.filter(g=>g.categoria===gastoFilter);
  const cur=state.settings.currency;
  const totMes = state.expenses.filter(g=>(g.fecha||'').slice(0,7)===todayISO().slice(0,7)).reduce((a,g)=>a+Number(g.monto||0),0);
  const totRecurrente = state.expenses.filter(g=>g.recurrente).reduce((a,g)=>a+Number(g.monto||0),0);
  const totGeneral = state.expenses.filter(g=>!g.clientId).reduce((a,g)=>a+Number(g.monto||0),0);
  const totPend = state.expenses.filter(g=>g.estado==='pendiente').reduce((a,g)=>a+Number(g.monto||0),0);

  const maxCat = Math.max(1,...GASTO_CATEGORIAS.map(cat=>state.expenses.filter(g=>g.categoria===cat).reduce((a,g)=>a+Number(g.monto||0),0)));
  const catBars = GASTO_CATEGORIAS.filter(cat=>state.expenses.some(g=>g.categoria===cat)).map(cat=>{
    const sum=state.expenses.filter(g=>g.categoria===cat).reduce((a,g)=>a+Number(g.monto||0),0);
    return `<div class="bar-row"><span class="bl" style="width:150px">${cat}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${(sum/maxCat)*100}%;background:var(--rose)"></div></div>
      <span class="bn" style="width:auto">${fmtMoney(sum,cur)}</span></div>`;
  }).join('') || '<p class="muted" style="font-size:12.5px">Todavía no hay gastos cargados.</p>';

  const filtSeg=`<div class="seg">
    <button class="${gastoFilter==='all'?'active':''}" onclick="gastoFilter='all';RENDER.pagos()">Todas</button>
    ${GASTO_CATEGORIAS.map(cat=>`<button class="${gastoFilter===cat?'active':''}" onclick="gastoFilter='${escapeHtml(cat)}';RENDER.pagos()">${cat}</button>`).join('')}
  </div>`;
  const rows=list.length?list.map(g=>{
    const st=GASTO_ESTADOS[g.estado]||GASTO_ESTADOS.pagado;
    return `<tr>
      <td><div style="font-weight:600">${escapeHtml(g.concepto||'Gasto')}</div><div class="muted" style="font-size:12px">${escapeHtml(g.categoria||'')}${g.recurrente?' · Recurrente':''}</div></td>
      <td>${g.clientId?escapeHtml(clientName(g.clientId)):'<span class="badge-pill b-gray"><span class="dot"></span>General del equipo</span>'}</td>
      <td style="font-family:var(--font-d);font-weight:700;color:var(--rose)">${fmtMoney(g.monto,g.moneda||cur)}</td>
      <td>${fmtDate(g.fecha)}</td>
      <td><select class="select-mini" onchange="setGastoState('${g.id}',this.value)">${Object.entries(GASTO_ESTADOS).map(([k,v])=>`<option value="${k}" ${g.estado===k?'selected':''}>${v.l}</option>`).join('')}</select></td>
      <td><div class="t-actions"><button class="icon-btn" onclick="gastoModal('${g.id}')">${svg(I.edit)}</button><button class="icon-btn" onclick="delItem('expenses','${g.id}','pagos')">${svg(I.trash)}</button></div></td>
    </tr>`;
  }).join(''):`<tr><td colspan="6">${emptyMini('Sin gastos registrados. Usá "Nuevo gasto" para empezar a llevar el control.')}</td></tr>`;

  return `
    <div class="grid cols-4" style="margin-bottom:18px">
      <div class="stat"><div class="s-ico b-rose">${svg(I.money)}</div><div class="s-val">${fmtMoney(totMes,cur)}</div><div class="s-lbl">Gastado este mes</div></div>
      <div class="stat"><div class="s-ico b-amber">${svg(I.clock)}</div><div class="s-val">${fmtMoney(totRecurrente,cur)}</div><div class="s-lbl">Recurrentes / mes</div></div>
      <div class="stat"><div class="s-ico b-violet">${svg(I.users)}</div><div class="s-val">${fmtMoney(totGeneral,cur)}</div><div class="s-lbl">Generales del equipo</div></div>
      <div class="stat"><div class="s-ico b-blue">${svg(I.clock)}</div><div class="s-val">${fmtMoney(totPend,cur)}</div><div class="s-lbl">Pendientes de pagar</div></div>
    </div>
    <div class="card" style="margin-bottom:18px">
      <div style="font-family:var(--font-d);font-weight:600;font-size:15px;margin-bottom:6px">Gastos por categoría</div>
      <div class="bars">${catBars}</div>
    </div>
    <div class="toolbar">${filtSeg}</div>
    <div class="table-wrap"><table><thead><tr><th>Concepto</th><th>Cliente / equipo</th><th>Monto</th><th>Fecha</th><th>Estado</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function setGastoState(id,v){const g=state.expenses.find(x=>x.id===id);g.estado=v;save();RENDER.pagos();}
function gastoModal(id){
  const g=id?state.expenses.find(x=>x.id===id):{estado:'pagado',moneda:state.settings.currency,fecha:todayISO(),categoria:GASTO_CATEGORIAS[0]};
  const cliOpts=`<option value="">General del equipo (sin cliente)</option>`+state.contacts.map(c=>`<option value="${c.id}" ${g.clientId===c.id?'selected':''}>${escapeHtml(c.nombre)}</option>`).join('');
  openModal(id?'Editar gasto':'Nuevo gasto',`
    <div class="field"><label>Concepto *</label><input id="f_con" value="${escapeHtml(g.concepto||'')}" placeholder="Ej: Editor freelance, Adobe CC, alquiler de estudio..."></div>
    <div class="field-row">
      <div class="field"><label>Categoría</label><select id="f_cat">${GASTO_CATEGORIAS.map(cat=>`<option ${g.categoria===cat?'selected':''}>${cat}</option>`).join('')}</select></div>
      <div class="field"><label>Asignado a</label><select id="f_cli">${cliOpts}</select></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Monto</label><input id="f_monto" type="number" value="${g.monto??''}" placeholder="0"></div>
      <div class="field"><label>Moneda</label><select id="f_mon"><option ${(g.moneda||'ARS')==='ARS'?'selected':''}>ARS</option><option ${g.moneda==='USD'?'selected':''}>USD</option></select></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Fecha</label><input id="f_fecha" type="date" value="${g.fecha||''}"></div>
      <div class="field"><label>Estado</label><select id="f_est">${Object.entries(GASTO_ESTADOS).map(([k,v])=>`<option value="${k}" ${g.estado===k?'selected':''}>${v.l}</option>`).join('')}</select></div>
    </div>
    <div class="check-row"><input type="checkbox" id="f_rec" ${g.recurrente?'checked':''}><label for="f_rec" style="margin:0">Es un gasto recurrente (mensual, ej: suscripción)</label></div>
    <div class="field"><label>Notas</label><textarea id="f_notas" placeholder="Detalles...">${escapeHtml(g.notas||'')}</textarea></div>
  `,()=>{
    const concepto=val('f_con'); if(!concepto){toast('Poné un concepto');return false;}
    const obj={id:id||uid(),concepto,categoria:val('f_cat'),clientId:val('f_cli'),monto:val('f_monto'),moneda:val('f_mon'),
      fecha:val('f_fecha'),estado:val('f_est'),recurrente:document.getElementById('f_rec').checked,notas:val('f_notas')};
    if(id){const i=state.expenses.findIndex(x=>x.id===id);state.expenses[i]=obj;}else state.expenses.unshift(obj);
    save();renderNav();RENDER.pagos();toast(id?'Gasto actualizado':'Gasto cargado');
  });
}

/* ---- PLANES ---- */
RENDER.planes=function(){
  topAction(`<button class="btn btn-ghost" onclick="addPlan()">${svg(I.plus)} Agregar plan</button>`);
  const cards=state.plans.map(p=>{
    const empty=!p.nombre;
    return `<div class="plan-card ${p.destacado?'featured':''}">
      ${p.destacado?'<div class="feat-tag">Recomendado</div>':''}
      <div class="p-name ${empty?'plan-empty':''}">${empty?'Plan sin nombre':escapeHtml(p.nombre)}</div>
      <div class="p-price">${p.precio!==''&&p.precio!=null?fmtMoney(p.precio,p.moneda||'ARS'):'<span class="plan-empty" style="font-size:20px">A definir</span>'}<span class="per">/${escapeHtml(p.periodo||'mes')}</span></div>
      <div class="p-desc">${p.descripcion?escapeHtml(p.descripcion):'<span class="plan-empty">Agregá una descripción del plan</span>'}</div>
      <ul>${(p.servicios&&p.servicios.length)?p.servicios.map(s=>`<li>${svg(I.check)} ${escapeHtml(s)}</li>`).join(''):'<li class="plan-empty">Sin servicios cargados</li>'}</ul>
      <div class="p-actions">
        <button class="btn btn-ghost btn-sm" style="flex:1" onclick="planModal('${p.id}')">${svg(I.edit)} Editar</button>
        <button class="btn btn-danger btn-sm" onclick="delPlan('${p.id}')">${svg(I.trash)}</button>
      </div>
    </div>`;
  }).join('');
  C().innerHTML=`<p class="muted" style="margin-bottom:18px">Definí tus planes de trabajo. Después podés asignarlos a cada cliente y el ingreso mensual se calcula solo.</p>
    <div class="grid cols-3">${cards}</div>`;
};
function planModal(id){
  const p=planById(id);
  openModal('Editar plan',`
    <div class="field-row">
      <div class="field"><label>Nombre del plan</label><input id="f_nom" value="${escapeHtml(p.nombre||'')}" placeholder="Ej: Plan Crecimiento"></div>
      <div class="field"><label>Período</label><input id="f_per" value="${escapeHtml(p.periodo||'mes')}" placeholder="mes"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Precio</label><input id="f_pre" type="number" value="${p.precio??''}" placeholder="0"></div>
      <div class="field"><label>Moneda</label><select id="f_mon"><option ${(p.moneda||'ARS')==='ARS'?'selected':''}>ARS</option><option ${p.moneda==='USD'?'selected':''}>USD</option></select></div>
    </div>
    <div class="field"><label>Descripción corta</label><input id="f_desc" value="${escapeHtml(p.descripcion||'')}" placeholder="Para quién es este plan"></div>
    <div class="field"><label>Servicios incluidos (uno por línea)</label><textarea id="f_serv" placeholder="Ej:\n8 reels editados\n12 historias\nGuiones y guión técnico\nCommunity management">${(p.servicios||[]).join('\n')}</textarea></div>
    <div class="check-row"><input type="checkbox" id="f_dest" ${p.destacado?'checked':''}><label for="f_dest" style="margin:0">Marcar como plan recomendado</label></div>
  `,()=>{
    p.nombre=val('f_nom'); p.periodo=val('f_per')||'mes'; p.precio=val('f_pre'); p.moneda=val('f_mon');
    p.descripcion=val('f_desc'); p.servicios=document.getElementById('f_serv').value.split('\n').map(s=>s.trim()).filter(Boolean);
    p.destacado=document.getElementById('f_dest').checked;
    save();RENDER.planes();toast('Plan guardado');
  });
}
function addPlan(){ state.plans.push({id:uid(),nombre:'',precio:'',moneda:state.settings.currency,periodo:'mes',descripcion:'',servicios:[],destacado:false}); save(); RENDER.planes(); }
function delPlan(id){ const p=planById(id); confirmModal('¿Eliminar plan?',`"${p.nombre||'Plan sin nombre'}" se quitará. Los clientes con este plan quedarán sin plan asignado.`,()=>{ state.plans=state.plans.filter(x=>x.id!==id); state.contacts.forEach(c=>{if(c.planId===id)c.planId='';}); save(); RENDER.planes(); toast('Plan eliminado'); }); }

/* ---- AJUSTES ---- */
RENDER.ajustes=function(){
  topAction('');
  const s=state.settings;
  C().innerHTML=`
    <div class="grid cols-2">
      <div class="card">
        <div style="font-family:var(--font-d);font-weight:600;font-size:15px;margin-bottom:14px">Agencia</div>
        <div class="field" style="margin-bottom:14px"><label>Nombre de la agencia</label><input id="s_brand" value="${escapeHtml(s.brand||'')}"></div>

        <button class="btn btn-primary" onclick="saveSettings()">${svg(I.check)} Guardar cambios</button>
      </div>
      <div class="card">
        <div style="font-family:var(--font-d);font-weight:600;font-size:15px;margin-bottom:6px">Datos</div>

          <button class="btn btn-ghost" onclick="document.getElementById('importFile').click()">Importar respaldo</button>
          <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(this)">
        </div>
        <div style="border-top:1px solid var(--border-soft);margin:18px 0"></div>

    </div>

      <div style="font-family:var(--font-d);font-weight:600;font-size:15px;margin-bottom:12px">Resumen de tu base</div>

        <div><div class="s-val" style="font-size:24px">${state.contacts.length}</div><div class="muted" style="font-size:12px">Contactos</div></div>
        <div><div class="s-val" style="font-size:24px">${state.tasks.length}</div><div class="muted" style="font-size:12px">Tareas</div></div>
        <div><div class="s-val" style="font-size:24px">${state.posts.length}</div><div class="muted" style="font-size:12px">Publicaciones</div></div>
        <div><div class="s-val" style="font-size:24px">${state.payments.length}</div><div class="muted" style="font-size:12px">Cobros</div></div>

};
function saveSettings(){ state.settings.brand=val('s_brand')||'Tu Agencia'; state.settings.currency=document.getElementById('s_cur').value; save(); applyBrand(); toast('Ajustes guardados'); }
function applyBrand(){ document.getElementById('brandName').textContent=state.settings.brand; document.getElementById('brandMark').textContent=(state.settings.brand||'A')[0].toUpperCase(); }
function exportData(){ const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='crm-respaldo-'+todayISO()+'.json'; a.click(); toast('Respaldo descargado'); }
function importData(input){ const f=input.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); state=Object.assign(defaults(),d); save(); applyBrand(); renderNav(); go('dashboard'); toast('Datos importados'); }catch(e){ toast('Archivo inválido'); } }; r.readAsText(f); }
function resetData(){ confirmModal('¿Borrar todos los datos?','Esta acción no se puede deshacer. Se eliminarán todos los contactos, tareas, publicaciones, cobros y planes.',()=>{ state=defaults(); save(); applyBrand(); renderNav(); go('dashboard'); toast('Datos reiniciados'); }); }

/* ---- GENERIC DELETE / CONFIRM ---- */
function delItem(coll,id,view){ confirmModal('¿Eliminar este elemento?','Esta acción no se puede deshacer.',()=>{ state[coll]=state[coll].filter(x=>x.id!==id); save(); renderNav(); RENDER[view](); toast('Eliminado'); }); }
function confirmModal(title,msg,onYes){
  openModal(title,`<p style="color:var(--text-2)">${msg}</p>`,()=>{ onYes(); },'Sí, confirmar');
  const btn=document.getElementById('modalSave'); btn.classList.remove('btn-primary'); btn.classList.add('btn-danger');
}

/* ============ AUTH + INIT ============ */
async function doLogin(){
  const email=(val('login_email')||'').trim();
  const pass=document.getElementById('login_pass').value||'';
  const btn=document.getElementById('loginBtn');
  const err=document.getElementById('loginErr');
  err.textContent='';
  if(!email||!pass){ err.textContent='Completá email y contraseña.'; return; }
  btn.disabled=true; btn.textContent='Entrando…';
  try{
    const { error } = await sb.auth.signInWithPassword({ email, password:pass });
    if(error) throw error;
    await startApp();
  }catch(e){
    err.textContent='No se pudo entrar. Revisá el email y la contraseña.';
    btn.disabled=false; btn.textContent='Entrar';
  }
}
async function doLogout(){ try{ await sb.auth.signOut(); }catch(e){} location.reload(); }
async function startApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='grid';
  await load();
  await loadOnboardingSubs();
  applyBrand();
  renderNav();
  go('dashboard');
}
document.getElementById('login_pass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
(async function(){
  try{
    const { data:{ session } } = await sb.auth.getSession();
    if(session){ await startApp(); return; }
  }catch(e){ console.error('Auth init:', e); }
  document.getElementById('loginScreen').style.display='flex';
})();
</script>
